# KataGo analysis-engine config used by scripts/analyzer.mjs.
# Tune numSearchThreads / nnMaxBatchSize for your GPU if needed.

logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false

# IMPORTANT: the web app stores winrates from Black's perspective.
reportAnalysisWinratesAs = BLACK

# Four positions of a game are searched at once, 16 threads each. On the PC's
# RTX 3090 with the b10c512 net this ran at ~1,890 visits/s against ~1,390
# for one position at a time (2026-09-29); the GPU is then ~85% busy.
# The TensorRT engine for batch 64 is cached in ~/.katago/trtcache.
numAnalysisThreads = 4
numSearchThreadsPerAnalysisThread = 16

nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# The worker sends its own maxVisits (10,000 by default) with every query.
maxVisits = 10000
