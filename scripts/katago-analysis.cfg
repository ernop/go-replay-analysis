# KataGo analysis-engine config used by scripts/analyzer.mjs.
# Tune numSearchThreads / nnMaxBatchSize for your GPU if needed.

logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false

# IMPORTANT: the web app stores winrates from Black's perspective.
reportAnalysisWinratesAs = BLACK

numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 16

nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

maxVisits = 400
